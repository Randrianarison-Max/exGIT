
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSite</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
        }

        nav h2 {
            color: #38bdf8;
        }

        .container {
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 35px;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0369a1;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MiniSite</h2>
        <span>Mon premier projet Git</span>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Bienvenue ! 👋</h1>
            <p>
                Ceci est mon premier projet HTML et CSS
                publié sur GitHub avec Debian Linux.
            </p>

            <button onclick="alert('Bonjour depuis MiniSite !')">
                Clique ici
            </button>
        </div>
    </div>

</body>
</html>
